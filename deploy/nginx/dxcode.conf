# DXCode — hardened Nginx reverse proxy
# Web  → 127.0.0.1:3000
# API  → 127.0.0.1:4000
#
# Mitigations include Path Traversal / Directory Traversal (../ %2e%2e%2f …),
# TLS hardening, rate limits, probe blocking, and proxy-only backends.
#
# Install (Ubuntu):
#   1) sudo cp deploy/nginx/conf.d/dxcode-maps.conf /etc/nginx/conf.d/
#   2) sudo cp deploy/nginx/snippets/dxcode-proxy.conf \
#              deploy/nginx/snippets/dxcode-security.conf /etc/nginx/snippets/
#   3) Replace YOUR_DOMAIN / YOUR_API_DOMAIN below (and cert paths).
#      If one SAN cert covers both hosts, point BOTH ssl_* paths at
#      /etc/letsencrypt/live/YOUR_DOMAIN/...
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: limit_req_zone / map / upstream must live in http { }.
# If this file is included under sites-enabled only, move the top
# block into /etc/nginx/conf.d/dxcode-http.conf (or nginx.conf http{}).

# ---- http-context pieces (move to conf.d if sites-only include fails) ----
limit_req_zone $binary_remote_addr zone=dx_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dx_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dx_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=dx_conn:10m;

upstream dxcode_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream dxcode_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Included again safely if already loaded from conf.d (duplicate map = error).
# Prefer ONLY /etc/nginx/conf.d/dxcode-maps.conf in production.
# include /etc/nginx/conf.d/dxcode-maps.conf;

# =========================
# WEB — HTTP → HTTPS
# =========================
server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  # Never serve app files from disk — only ACME token files.
  root /var/www/certbot;
  merge_slashes on;

  include /etc/nginx/snippets/dxcode-security.conf;

  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# API — HTTP → HTTPS
# =========================
server {
  listen 80;
  listen [::]:80;
  server_name YOUR_API_DOMAIN;

  root /var/www/certbot;
  merge_slashes on;

  include /etc/nginx/snippets/dxcode-security.conf;

  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# WEB — HTTPS
# =========================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name YOUR_DOMAIN;

  # SAN cert issued for YOUR_DOMAIN often also covers api — reuse same path if so.
  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  # OCSP stapling optional; some LE chains omit responder URL
  # ssl_stapling on;
  # ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  server_tokens off;
  # more_clear_headers Server; # needs headers-more module

  # Do not expose a document root for the app (proxy only).
  root /var/www/empty;
  merge_slashes on;
  absolute_redirect off;
  port_in_redirect off;

  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 65s;
  large_client_header_buffers 4 16k;

  limit_conn dx_conn 40;
  limit_req zone=dx_general burst=40 nodelay;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  # App middleware sets DENY + full CSP; avoid weaker duplicate frame/CSP here.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;

  # Block uncommon verbs on the public site edge
  if ($request_method ~* "^(TRACE|TRACK|DEBUG)$") {
    return 405;
  }

  include /etc/nginx/snippets/dxcode-security.conf;

  location ~* ^/(login|register|recover)(/|$) {
    limit_req zone=dx_auth burst=10 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }

  location ~* ^/api/auth/ {
    limit_req zone=dx_auth burst=10 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }

  location / {
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }
}

# =========================
# API — HTTPS
# =========================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name YOUR_API_DOMAIN;

  # Prefer shared SAN cert under YOUR_DOMAIN when certbot issued one leaf for both names:
  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  server_tokens off;

  root /var/www/empty;
  merge_slashes on;
  absolute_redirect off;
  port_in_redirect off;

  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;
  large_client_header_buffers 4 16k;

  limit_conn dx_conn 60;
  limit_req zone=dx_api burst=60 nodelay;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  include /etc/nginx/snippets/dxcode-security.conf;

  location ~* ^/(auth|identity|commerce|checkout)/ {
    limit_req zone=dx_auth burst=15 nodelay;
    proxy_pass http://dxcode_api;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }

  location / {
    proxy_pass http://dxcode_api;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }
}
