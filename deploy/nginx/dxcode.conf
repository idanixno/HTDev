# DXCode — maximum practical Nginx hardening
# Web  → 127.0.0.1:3000 | API → 127.0.0.1:4000
#
# Prerequisites (http context):
#   sudo cp deploy/nginx/conf.d/dxcode-maps.conf /etc/nginx/conf.d/
#   sudo cp deploy/nginx/conf.d/dxcode-http.conf /etc/nginx/conf.d/
#   sudo cp deploy/nginx/snippets/* /etc/nginx/snippets/
#
# Then:
#   sed replace YOUR_DOMAIN / YOUR_API_DOMAIN
#   Both ssl_* paths use YOUR_DOMAIN when one SAN leaf covers api too.
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file must contain ONLY server{} blocks (zones/upstreams live in conf.d).

# ---- default catch-all (HTTP): drop unknown Host / IP hits ----
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  return 444;
}

# =========================
# WEB — HTTP → HTTPS
# =========================
server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  root /var/www/certbot;
  merge_slashes on;
  server_tokens off;

  include /etc/nginx/snippets/dxcode-security.conf;

  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# API — HTTP → HTTPS
# =========================
server {
  listen 80;
  listen [::]:80;
  server_name YOUR_API_DOMAIN;

  root /var/www/certbot;
  merge_slashes on;
  server_tokens off;

  include /etc/nginx/snippets/dxcode-security.conf;

  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# WEB — HTTPS
# =========================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name YOUR_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:DX_SSL:20m;
  ssl_session_tickets off;
  ssl_early_data off;
  ssl_buffer_size 4k;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 3s;

  server_tokens off;
  root /var/www/empty;
  merge_slashes on;
  absolute_redirect off;
  port_in_redirect off;
  ignore_invalid_headers on;
  underscores_in_headers off;
  if_modified_since off;
  chunked_transfer_encoding on;

  client_max_body_size 8m;
  client_body_buffer_size 16k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;
  send_timeout 30s;
  keepalive_timeout 30s;
  keepalive_requests 200;
  reset_timedout_connection on;

  limit_conn dx_conn 30;
  limit_req zone=dx_general burst=30 nodelay;
  limit_req_status 429;
  limit_conn_status 429;

  include /etc/nginx/snippets/dxcode-headers-web.conf;
  include /etc/nginx/snippets/dxcode-security.conf;

  if ($dx_web_method_ok = 0) {
    return 405;
  }

  # Static / Next assets — higher rate, still hardened
  location ^~ /_next/static/ {
    limit_req zone=dx_static burst=80 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    # immutable hashed assets
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/dxcode-headers-web.conf;
  }

  location ^~ /artwork/ {
    limit_req zone=dx_static burst=60 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    include /etc/nginx/snippets/dxcode-headers-web.conf;
  }

  location ~* ^/(login|register|recover)(/|$) {
    limit_req zone=dx_auth burst=8 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    include /etc/nginx/snippets/dxcode-headers-web.conf;
  }

  location ~* ^/api/auth/ {
    limit_req zone=dx_auth burst=8 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    include /etc/nginx/snippets/dxcode-headers-web.conf;
  }

  location / {
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    include /etc/nginx/snippets/dxcode-headers-web.conf;
  }
}

# =========================
# API — HTTPS
# =========================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name YOUR_API_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:DX_SSL:20m;
  ssl_session_tickets off;
  ssl_early_data off;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 3s;

  server_tokens off;
  root /var/www/empty;
  merge_slashes on;
  absolute_redirect off;
  port_in_redirect off;
  ignore_invalid_headers on;
  underscores_in_headers off;

  client_max_body_size 8m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;
  send_timeout 30s;
  keepalive_timeout 30s;
  reset_timedout_connection on;

  limit_conn dx_conn 50;
  limit_req zone=dx_api burst=40 nodelay;
  limit_req_status 429;
  limit_conn_status 429;

  include /etc/nginx/snippets/dxcode-headers-api.conf;
  include /etc/nginx/snippets/dxcode-security.conf;

  if ($dx_api_method_ok = 0) {
    return 405;
  }

  location ~* ^/(auth|identity|commerce|checkout)/ {
    limit_req zone=dx_auth burst=10 nodelay;
    proxy_pass http://dxcode_api;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    include /etc/nginx/snippets/dxcode-headers-api.conf;
  }

  location / {
    proxy_pass http://dxcode_api;
    include /etc/nginx/snippets/dxcode-proxy.conf;
    include /etc/nginx/snippets/dxcode-headers-api.conf;
  }
}
