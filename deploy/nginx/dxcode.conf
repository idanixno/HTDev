# DXCode / hardened Nginx reverse proxy
# Web  → 127.0.0.1:3000
# API  → 127.0.0.1:4000
#
# Install:
#   1) Replace YOUR_DOMAIN and YOUR_API_DOMAIN
#   2) sudo cp deploy/nginx/dxcode.conf /etc/nginx/sites-available/dxcode
#   3) sudo ln -sf /etc/nginx/sites-available/dxcode /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d YOUR_DOMAIN -d YOUR_API_DOMAIN
#
# After Certbot, keep the HTTPS server blocks (certbot usually edits this file).

# ---- rate limits (define once in http{} if you move these to nginx.conf) ----
limit_req_zone $binary_remote_addr zone=dx_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dx_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dx_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=dx_conn:10m;

upstream dxcode_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream dxcode_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Shared hardening snippets via include would also work; inlined for one-file deploy.

# =========================
# WEB — HTTP → HTTPS
# =========================
server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  # ACME challenge for Certbot
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# API — HTTP → HTTPS
# =========================
server {
  listen 80;
  listen [::]:80;
  server_name YOUR_API_DOMAIN;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# WEB — HTTPS
# =========================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name YOUR_DOMAIN;

  # Certbot will replace these paths; placeholders until first issue:
  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  server_tokens off;
  more_clear_headers Server; # needs headers-more; safe to remove if module missing

  # Limits
  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;
  keepalive_timeout 65s;
  large_client_header_buffers 4 16k;

  limit_conn dx_conn 40;
  limit_req zone=dx_general burst=40 nodelay;

  # Security headers (app may also set some; duplicates are OK)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;

  # Block sensitive / probe paths
  location ~* /(^|/)\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }
  location ~* \.(?:env|git|svn|htaccess|htpasswd|DS_Store|bak|sql|yml|yaml|toml)$ {
    deny all;
    return 404;
  }
  location ~* ^/(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|adminer|\.aws) {
    deny all;
    return 404;
  }

  # Stricter auth surface (Next login/register + BFF auth)
  location ~* ^/(login|register|recover)(/|$) {
    limit_req zone=dx_auth burst=10 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }

  location ~* ^/api/auth/ {
    limit_req zone=dx_auth burst=10 nodelay;
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }

  location / {
    proxy_pass http://dxcode_web;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }
}

# =========================
# API — HTTPS
# =========================
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name YOUR_API_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/YOUR_API_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_API_DOMAIN/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/YOUR_API_DOMAIN/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  server_tokens off;

  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;

  limit_conn dx_conn 60;
  limit_req zone=dx_api burst=60 nodelay;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location ~* /(^|/)\. {
    deny all;
    return 404;
  }

  # Auth / OTP / checkout more strict
  location ~* ^/(auth|identity|commerce|checkout)/ {
    limit_req zone=dx_auth burst=15 nodelay;
    proxy_pass http://dxcode_api;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }

  location / {
    proxy_pass http://dxcode_api;
    include /etc/nginx/snippets/dxcode-proxy.conf;
  }
}
