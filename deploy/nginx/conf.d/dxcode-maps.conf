# Place in http { } context, e.g.:
#   include /etc/nginx/conf.d/dxcode-maps.conf;
#
# Path Traversal / Directory Traversal detection on raw request URI
# (catches ../  ..\\  %2e%2e%2f  %252e  null bytes, CRLF smuggling attempts).
#
# Note: do NOT use regex quantifiers like {2} here — nginx treats "{" as config syntax.

map $request_uri $dx_bad_uri {
  default 0;

  # Literal traversal segments
  ~*(^|[\\/])\.\.([\\/]|$) 1;
  ~*\.\.[\\/] 1;
  ~*[\\/]\.\.$ 1;

  # URL-encoded dots: %2e%2e  %2E%2E  mixed
  ~*(%2e|%2E)(%2e|%2E) 1;

  # Double-encoded: %252e%252e
  ~*(%252e|%252E)(%252e|%252E) 1;

  # Unicode / overlong / UTF-8 dot tricks often used in scanners
  ~*(%c0%ae|%c0%AF|%c1%9c|%e0%80%ae) 1;

  # Null byte & header-injection probes in the request line
  ~*%00 1;
  ~*%0d 1;
  ~*%0a 1;
}

# Absolute sensitive-path probes in URI (defense in depth for misconfigured alias/root)
map $request_uri $dx_sensitive_probe {
  default 0;
  ~*(/|%2f)etc(/|%2f)passwd 1;
  ~*(/|%2f)etc(/|%2f)shadow 1;
  ~*(/|%2f)proc(/|%2f)self 1;
  ~*(/|%2f)windows(/|%2f)win\.ini 1;
}
