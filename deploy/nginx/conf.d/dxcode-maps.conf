# http { } context — include /etc/nginx/conf.d/dxcode-maps.conf;
#
# Precise Path Traversal / Directory Traversal maps.
# Blocks real traversal segments + encodings, NOT every ".." inside a token (a..b).
# Do NOT use regex quantifiers like {2} — nginx treats "{" as config syntax.
# Do NOT put backslash inside [character classes] — PCRE sees "\]" and breaks.

# --- Raw request target (path + query as sent) ---
map $request_uri $dx_bad_uri_raw {
  default 0;

  # Segment traversal: /../  /.. at boundaries (not a..b)
  ~*(^|[/?#])\.\.([/?#]|$) 1;
  ~*/\.\./ 1;
  ~*/\.\.$ 1;
  ~*^\.\.([/?#]|$) 1;

  # Encoded dots forming a traversal segment
  ~*/(%2e|%2E)(%2e|%2E)(/|%2f|%2F|%5c|%5C|$) 1;
  ~*(%2e|%2E)(%2e|%2E)(%2f|%2F|%5c|%5C|/) 1;
  ~*(%2e|%2E)(%2e|%2E)([?#]|$) 1;

  # Mixed literal/encoded: .%2e  %2e.
  ~*/\.(%2e|%2E)(/|%2f|%2F|%5c|%5C|$) 1;
  ~*/(%2e|%2E)\.(/|%2f|%2F|%5c|%5C|$) 1;

  # Double / triple encoded ..
  ~*(%252e|%252E)(%252e|%252E) 1;
  ~*(%25252e|%25252E) 1;

  # Dot with junk separators between encoded dots
  ~*(%2e|%2E)(\+|%20|%09|%0a|%0d|%00)+(%2e|%2E) 1;

  # Backslash Windows-style (encoded only — safer for nginx PCRE)
  ~*(%5c|%255c)(%2e|%2E)(%2e|%2E) 1;
  ~*(%2e|%2E)(%2e|%2E)(%5c|%255c) 1;
  ~*\.\.(%5c|%255c) 1;
  ~*(%5c|%255c)\.\. 1;

  # UTF-8 / overlong / UCS dot tricks
  ~*(%c0%ae|%c0%AF|%c1%9c|%e0%80%ae|%ef%bc%8e)(%c0%ae|%c0%AF|%c1%9c|%e0%80%ae|%ef%bc%8e|%2e|%2E|\.) 1;
  ~*%u002e%u002e 1;

  # Null / CRLF in request target
  ~*%00 1;
  ~*%0d%0a 1;
}

# --- Normalized path only ($uri has no query; decoded once) ---
map $uri $dx_bad_uri_norm {
  default 0;
  ~*(^|/)\.\.(/|$) 1;
}

# --- Query: traversal-shaped values only ---
map $query_string $dx_bad_query {
  default 0;
  ~*(^|[=&])\.\.([/]|%2f|%2F|%5c|%5C|$) 1;
  ~*/\.\./ 1;
  ~*(%2e|%2E)(%2e|%2E)(%2f|%2F|%5c|%5C|/) 1;
  ~*(%252e|%252E)(%252e|%252E) 1;
  ~*(%c0%ae|%ef%bc%8e)(%c0%ae|%2e|%2E) 1;
  ~*%00 1;
}

# --- Classic absolute sensitive targets ---
map $request_uri $dx_sensitive_probe {
  default 0;
  ~*(/|%2f|%5c)etc(/|%2f|%5c)passwd 1;
  ~*(/|%2f|%5c)etc(/|%2f|%5c)shadow 1;
  ~*(/|%2f|%5c)etc(/|%2f|%5c)hosts 1;
  ~*(/|%2f|%5c)proc(/|%2f|%5c)self 1;
  ~*(/|%2f|%5c)proc(/|%2f|%5c)version 1;
  ~*(/|%2f|%5c)windows(/|%2f|%5c)win\.ini 1;
  ~*(/|%2f)boot\.ini 1;
}

# Combined flag for snippets/dxcode-security.conf
map "$dx_bad_uri_raw$dx_bad_uri_norm$dx_bad_query$dx_sensitive_probe" $dx_bad_uri {
  default 1;
  "0000" 0;
}
