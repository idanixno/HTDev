# http { } context — include /etc/nginx/conf.d/dxcode-maps.conf;
#
# Strict Path Traversal / Directory Traversal WAF-style maps.
# Do NOT use regex quantifiers like {2} — nginx treats "{" as config syntax.

# --- Raw request line (as sent by client, before decode) ---
map $request_uri $dx_bad_uri_raw {
  default 0;

  # Any consecutive dots in path/query (strict)
  ~*\.\. 1;

  # Single-encoded dots forming ..
  ~*(%2e|%2E)(%2e|%2E) 1;
  ~*(%2e|%2E)\.(%2e|%2E|\.|$) 1;
  ~*\.(%2e|%2E) 1;

  # Double / triple encoded
  ~*(%252e|%252E)(%252e|%252E|%2e|%2E|\.) 1;
  ~*(%25252e|%25252E) 1;

  # Dot with separators scanners insert between %2e
  ~*(%2e|%2E)(\+|%20|%09|%0a|%0d|%00)+(%2e|%2E) 1;

  # Backslash / Windows separators around dots
  ~*\.\.[\\/] 1;
  ~*[\\/]\.\. 1;
  ~*(%5c|%255c|\\)\.\. 1;
  ~*\.\.(%5c|%255c|\\) 1;
  ~*(%2e|%2E)(%5c|/)(%2e|%2E) 1;

  # UTF-8 / overlong / UCS tricks for "."
  ~*(%c0%ae|%c0%AF|%c1%9c|%e0%80%ae|%ef%bc%8e) 1;
  ~*%u002e%u002e 1;
  ~*%u002e 1;

  # Null / CRLF in request target (smuggling-ish probes)
  ~*%00 1;
  ~*%0d 1;
  ~*%0a 1;
}

# --- Normalized path ($uri is decoded + normalized; no query) ---
map $uri $dx_bad_uri_norm {
  default 0;
  ~*\.\. 1;
  ~*\\ 1;
}

# --- Query string alone (e.g. ?file=../../etc/passwd) ---
map $query_string $dx_bad_query {
  default 0;
  ~*\.\. 1;
  ~*(%2e|%2E)(%2e|%2E) 1;
  ~*(%252e|%252E)(%252e|%252E) 1;
  ~*(%c0%ae|%ef%bc%8e|%u002e) 1;
  ~*%00 1;
}

# --- Classic absolute sensitive targets anywhere in raw URI ---
map $request_uri $dx_sensitive_probe {
  default 0;
  ~*(/|%2f|%5c|\\)etc(/|%2f|%5c|\\)passwd 1;
  ~*(/|%2f|%5c|\\)etc(/|%2f|%5c|\\)shadow 1;
  ~*(/|%2f|%5c|\\)etc(/|%2f|%5c|\\)hosts 1;
  ~*(/|%2f|%5c|\\)proc(/|%2f|%5c|\\)self 1;
  ~*(/|%2f|%5c|\\)proc(/|%2f|%5c|\\)version 1;
  ~*(/|%2f|%5c|\\)windows(/|%2f|%5c|\\)win\.ini 1;
  ~*(/|%2f|%5c|\\)boot\.ini 1;
  ~*(/|%2f)(\.|%2e)+(env|git|aws|docker) 1;
}

# Combined flag used by snippets/dxcode-security.conf
map "$dx_bad_uri_raw$dx_bad_uri_norm$dx_bad_query$dx_sensitive_probe" $dx_bad_uri {
  default 1;
  "0000" 0;
}
