# http { } extras for DXCode — copy to /etc/nginx/conf.d/dxcode-http.conf
# (alongside dxcode-maps.conf). Do not also define these inside sites-available.

limit_req_zone $binary_remote_addr zone=dx_general:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=dx_auth:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=dx_api:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=dx_static:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=dx_conn:10m;

upstream dxcode_web {
  server 127.0.0.1:3000 fail_timeout=10s max_fails=3;
  keepalive 32;
  keepalive_requests 1000;
  keepalive_timeout 60s;
}

upstream dxcode_api {
  server 127.0.0.1:4000 fail_timeout=10s max_fails=3;
  keepalive 32;
  keepalive_requests 1000;
  keepalive_timeout 60s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Web edge: browser + Next BFF (/api/auth, /api/admin use PATCH/PUT/DELETE).
# Non-API HTML forms stay POST; scanners still blocked via default 0.
map $request_method $dx_web_method_ok {
  default 0;
  GET 1;
  HEAD 1;
  POST 1;
  PUT 1;
  PATCH 1;
  DELETE 1;
  OPTIONS 1;
}

map $request_method $dx_api_method_ok {
  default 0;
  GET 1;
  HEAD 1;
  POST 1;
  PUT 1;
  PATCH 1;
  DELETE 1;
  OPTIONS 1;
}

# Drop obvious scanner UAs (empty UA allowed)
map $http_user_agent $dx_bad_ua {
  default 0;
  ~*(nikto|sqlmap|nmap(?:ing)?|masscan|dirbuster|gobuster|wfuzz|nuclei|zgrab|wpscan|acunetix|nessus|openvas|havij) 1;
}
