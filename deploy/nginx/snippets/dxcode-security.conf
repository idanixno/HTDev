# Server-level hardening for DXCode (include inside each server { }).
# Precise Path Traversal blocking + probe denials.
# Requires /etc/nginx/conf.d/dxcode-maps.conf in http { }.

if ($dx_bad_uri) {
  return 404;
}

# Decoded path segment traversal only (not a..b)
if ($uri ~ "(^|/)\.\.(/|$)") {
  return 404;
}

if ($uri ~ "\\") {
  return 404;
}

location ~* /(^|/)\. {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}

location ~* \.(env|git|svn|hg|htaccess|htpasswd|DS_Store|bak|old|swp|sql|dump|log|pem|key|p12|pfx|yml|yaml|toml|ini|cfg|conf)$ {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}

location ~* ^/(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|adminer|cgi-bin|\.aws|\.azure|vendor/phpunit|actuator) {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}
