# Server-level hardening for DXCode (include inside each server { }).
# Strict Path Traversal / Directory Traversal + probe blocking.
# Requires /etc/nginx/conf.d/dxcode-maps.conf in http { }.

# Combined raw + normalized + query + sensitive-path maps
if ($dx_bad_uri) {
  return 404;
}

# Extra belt: normalized URI must never retain ".." after nginx decode
if ($uri ~* "\.\.") {
  return 404;
}

# Backslash in path (Windows traversal / confuse-the-parser)
if ($uri ~ "\\") {
  return 404;
}

# Hidden / VCS / secret files anywhere in the path
location ~* /(^|/)\. {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}

location ~* \.(env|git|svn|hg|htaccess|htpasswd|DS_Store|bak|old|swp|sql|dump|log|pem|key|p12|pfx|yml|yaml|toml|ini|cfg|conf)$ {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}

# Scanner noise
location ~* ^/(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|adminer|cgi-bin|\.aws|\.azure|vendor/phpunit|actuator) {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}
