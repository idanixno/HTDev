# Server-level hardening (include inside each server { }).
# Requires /etc/nginx/conf.d/dxcode-maps.conf (+ ideally dxcode-http.conf).

# Path Traversal / sensitive probes (maps)
if ($dx_bad_uri) {
  return 404;
}

if ($uri ~ "(^|/)\.\.(/|$)") {
  return 404;
}

# Scanner UA (defined in dxcode-http.conf)
if ($dx_bad_ua) {
  return 404;
}

# Overlong request lines / weird absolute-form probes
if ($request_uri ~* "^https?:") {
  return 400;
}

location ~* /\. {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}

location ~* \.(env|git|svn|hg|htaccess|htpasswd|DS_Store|bak|old|swp|swo|sql|dump|log|pem|key|p12|pfx|yml|yaml|toml|ini|cfg|conf|dist|inc|phps|phtml|aspx?|jsp)$ {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}

location ~* ^/(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|adminer|cgi-bin|\.aws|\.azure|vendor/phpunit|actuator|server-status|server-info|mailman|webmail|owa|autodiscover) {
  deny all;
  access_log off;
  log_not_found off;
  return 404;
}
