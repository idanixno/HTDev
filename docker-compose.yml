services:
  postgres:
    image: postgres:16-alpine
    container_name: zharfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zharfa
      POSTGRES_PASSWORD: zharfa
      POSTGRES_DB: zharfa
    ports:
      - "5432:5432"
    volumes:
      - zharfa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zharfa -d zharfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zharfa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zharfa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: zharfa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zharfa
      MINIO_ROOT_PASSWORD: zharfadevpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zharfa_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  zharfa_pg:
  zharfa_redis:
  zharfa_minio:
